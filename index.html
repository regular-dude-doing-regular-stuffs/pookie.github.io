<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#003300" />
  <link rel="manifest" href="manifest.json" />
  <title>Boss Respawn Schedule</title>
  <style>
    body {
      font-family: "Courier New", monospace;
      background-color: #002b11;
      color: #00ff00;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    h1 {
      color: yellow;
      font-size: 2.5em;
      margin-top: 20px;
    }

    #phTime {
      color: #ff0000;
      font-size: 4em;
      font-weight: bold;
      text-shadow: 0 0 15px red;
      margin: 20px 0;
    }

    .subtitle {
      font-size: 0.9em;
      color: #aaffaa;
      margin-top: -10px;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 70%;
      background-color: #001a0a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px #003300;
    }

    th, td {
      padding: 14px;
      border-bottom: 2px solid #00ff00;
    }

    th {
      color: lime;
      font-size: 1.1em;
      font-weight: bold;
    }

    td {
      color: #00ff55;
      font-size: 1.2em;
      font-weight: bold;
      text-shadow: 0 0 8px #00ff55;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .action-btn {
      background-color: #003300;
      border: 1px solid #00ff00;
      color: #00ff00;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      margin: 2px;
    }

    .action-btn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    .login-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background-color: #002b11;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    .status {
      position: fixed;
      top: 20px;
      right: 130px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
      color: lime;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: lime;
    }

    .offline .status-dot {
      background-color: red;
    }

    .offline body {
      background-color: #111;
    }

    .small-date {
      display: block;
      font-size: 0.8em;
      color: #66ff99;
      text-shadow: none;
    }
  </style>
</head>
<body>
  <div class="status"><div class="status-dot"></div><span id="statusText">Connected</span></div>
  <button class="login-btn">Admin Login</button>

  <h1>Boss Respawn Schedule</h1>
  <div class="subtitle">Philippine Time (UTC+8)</div>
  <div id="phTime">--:--:--</div>

  <table>
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
        <th>ACTIONS</th>
      </tr>
    </thead>
    <tbody id="bossTable"></tbody>
  </table>

  <script>
    const JSON_URL = "https://api.jsonbin.io/v3/b/6737a5aead19ca34f8b35a9c/latest";
    let bossData = [];
    let isOnline = true;
    let lastFetched = 0;
    const REFRESH_INTERVAL = 10 * 60 * 1000; // 10 minutes
    const table = document.getElementById("bossTable");
    const statusDot = document.querySelector(".status-dot");
    const statusText = document.getElementById("statusText");

    // Display Philippine Time
    function updatePHTime() {
      const options = { timeZone: "Asia/Manila", hour12: true, hour: "numeric", minute: "numeric", second: "numeric" };
      document.getElementById("phTime").textContent = new Date().toLocaleTimeString("en-US", options);
    }
    setInterval(updatePHTime, 1000);
    updatePHTime();

    // Fetch boss data
    async function fetchBossData() {
      try {
        const now = Date.now();
        if (now - lastFetched < REFRESH_INTERVAL && bossData.length > 0) return;
        const res = await fetch(JSON_URL);
        const json = await res.json();
        bossData = json.record.bosses;
        lastFetched = now;
        localStorage.setItem("bossDataCache", JSON.stringify(bossData));
        localStorage.setItem("lastFetched", lastFetched);
        renderTable();
      } catch {
        console.warn("⚠️ Offline - using cached data");
        const cached = localStorage.getItem("bossDataCache");
        if (cached) bossData = JSON.parse(cached);
        renderTable();
      }
    }

    function renderTable() {
      table.innerHTML = "";
      if (!bossData || bossData.length === 0) {
        table.innerHTML = `<tr><td colspan="4">No data available</td></tr>`;
        return;
      }

      bossData.forEach((boss, index) => {
        const respawn = new Date(boss.respawn);
        const dateStr = respawn.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
        const shortDate = respawn.toLocaleString("en-US", { month: "short", day: "numeric" });

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${boss.name}</td>
          <td class="countdown" data-time="${respawn}">
            --:--:-- <span class="small-date">${shortDate}</span>
          </td>
          <td class="respawn-cell">${dateStr}</td>
          <td>
            <button class="action-btn" onclick="adjustTime(${index})">Adjust Time</button>
            <button class="action-btn" onclick="resetTimer(${index})">Reset</button>
          </td>`;
        table.appendChild(row);
      });
    }

    function updateCountdowns() {
      if (!isOnline) return; // freeze timers when offline
      const now = new Date().getTime();
      document.querySelectorAll(".countdown").forEach(el => {
        const target = new Date(el.dataset.time).getTime();
        let diff = target - now;
        const date = new Date(el.dataset.time);
        const shortDate = date.toLocaleString("en-US", { month: "short", day: "numeric" });

        if (diff < 0) diff = 0;
        const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, "0");
        const m = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, "0");
        const s = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");
        el.innerHTML = `${h}:${m}:${s} <span class="small-date">${shortDate}</span>`;
      });
    }
    setInterval(updateCountdowns, 1000);

    // Action functions
    function adjustTime(index) {
      const newTime = prompt("Enter new respawn time (HH:MM, 24-hour format):");
      if (!newTime || !/^\d{1,2}:\d{2}$/.test(newTime)) return alert("Invalid format. Use HH:MM.");
      const [h, m] = newTime.split(":").map(Number);
      const now = new Date();
      const newRespawn = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);

      bossData[index].respawn = newRespawn.toISOString();
      localStorage.setItem("bossDataCache", JSON.stringify(bossData));
      renderTable();
    }

    function resetTimer(index) {
      alert(`Timer reset for ${bossData[index].name} (placeholder action).`);
    }

    // Network handling
    window.addEventListener("online", () => {
      isOnline = true;
      document.body.classList.remove("offline");
      statusDot.style.backgroundColor = "lime";
      statusText.textContent = "Connected";
      fetchBossData();
    });

    window.addEventListener("offline", () => {
      isOnline = false;
      document.body.classList.add("offline");
      statusDot.style.backgroundColor = "red";
      statusText.textContent = "Offline (Frozen)";
    });

    // Initial load
    fetchBossData();
    setInterval(fetchBossData, REFRESH_INTERVAL);

    // Register Service Worker for PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then(() => console.log("✅ Service Worker Registered"))
          .catch(err => console.log("❌ Service Worker Failed:", err));
      });
    }
  </script>
</body>
</html>
