<body>
  <!-- Connection + Admin -->
  <div class="top-right">
    <div id="connectionStatus">🟢 Connected to JSONBin</div>
    <button id="adminLogin">Admin Login</button>
  </div>

  <!-- Title + Clock -->

  <h1>Boss Respawn Schedule</h1>
  <p style="text-align:center; margin-top:-10px;">Philippine Time (UTC+8)</p>
  <div id="clock">--:--:--</div>

  <!-- Floating Buttons -->

  <div class="floating-buttons">
    <button id="addTimer">Add New Timer</button>
    <button id="saveChanges">Save Changes</button>
  </div>

  <!-- Timer Table -->

  <table id="bossTable">
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
      </tr>
    </thead>
    <tbody id="timerBody">
      <!-- Timers load here -->
    </tbody>
  </table>

  <!-- === Scripts === -->

  <script>
    // === Digital Clock ===
    function updateClock() {
      const now = new Date();
      const options = { hour: 'numeric', minute: 'numeric', second: 'numeric', hour12: true, timeZone: 'Asia/Manila' };
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // === JSONBin Connection Test ===
    const connectionStatus = document.getElementById("connectionStatus");
    const BIN_URL = "https://api.jsonbin.io/v3/b/your-bin-id";
    const API_KEY = "$2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi";

    async function testConnection() {
      try {
        const response = await fetch(BIN_URL, { headers: { "X-Master-Key": API_KEY }});
        if (response.ok) {
          connectionStatus.textContent = "🟢 Connected to JSONBin";
          connectionStatus.classList.remove("offline");
        } else throw new Error("Connection failed");
      } catch {
        connectionStatus.textContent = "🔴 Disconnected from JSONBin";
        connectionStatus.classList.add("offline");
      }
    }
    testConnection();
    setInterval(testConnection, 600000); // every 10 minutes

    // === Dummy Data Load ===
    const timers = [
      { boss: "VENATUS", countdown: "09:59:55", respawn: "Nov 6, 2025, 2:57 PM" },
      { boss: "VIORENT", countdown: "09:59:55", respawn: "Nov 6, 2025, 2:57 PM" },
      { boss: "EGO", countdown: "20:59:55", respawn: "Nov 7, 2025, 1:57 AM" }
    ];

    const tbody = document.getElementById("timerBody");
    timers.forEach(t => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${t.boss}</td>
        <td>${t.countdown}</td>
        <td class="respawn">${t.respawn}</td>
      `;
      tbody.appendChild(row);
    });

    // === PWA Service Worker ===
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").then(() => {
        console.log("✅ Service Worker Registered");
      });
    }
  </script>

</body>
