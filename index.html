<body>
  <h1>Boss Respawn Schedule</h1>
  <div id="clock"></div>

  <!-- 🧭 Connection + Admin Controls -->

  <div id="connectionStatus">🟢 Connected to JSONBin</div>
  <button id="adminLogin">Admin Login</button>
  <div id="adminButtons">
    <button class="admin-btn" id="addTimer"></button>
    <button class="admin-btn" id="saveChanges"></button>
  </div>

  <!-- 📋 Timer Table -->

  <table id="timerTable">
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="toast"></div>

  <script>
    /* ========== 🕒 Clock (PH Time, UTC+8) ========== */
    function updateClock() {
      const now = new Date();
      const utc8 = new Date(now.getTime() + 8 * 60 * 60 * 1000);
      let hours = utc8.getUTCHours();
      const minutes = String(utc8.getUTCMinutes()).padStart(2, "0");
      const seconds = String(utc8.getUTCSeconds()).padStart(2, "0");
      const ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ========== 📦 JSONBin Configuration ========== */
    const BIN_URL = "https://api.jsonbin.io/v3/b/6909f9efae596e708f43d542";
    const API_KEY = "$2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi";
    let isAdmin = false;

    /* ========== 💾 Toast Helper ========== */
    function showToast(msg, success = true) {
      const toast = document.getElementById("toast");
      toast.style.backgroundColor = success ? "rgba(0,128,128,0.9)" : "rgba(255,0,0,0.9)";
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    /* ========== 🧭 Connection Status Check ========== */
    const connectionStatus = document.getElementById("connectionStatus");
    async function checkConnection() {
      try {
        const res = await fetch(BIN_URL, { headers: { "X-Master-Key": API_KEY } });
        if (res.ok) {
          connectionStatus.textContent = "🟢 Connected to JSONBin";
        } else {
          connectionStatus.textContent = "🔴 Disconnected from JSONBin";
        }
      } catch {
        connectionStatus.textContent = "🔴 Disconnected from JSONBin";
      }
    }
    checkConnection();
    setInterval(checkConnection, 120000);

    /* ========== 🕹️ Admin Login ========== */
    document.getElementById("adminLogin").addEventListener("click", () => {
      const pwd = prompt("Enter Admin Password:");
      if (pwd === "Iamtoogood009") {
        isAdmin = true;
        document.getElementById("adminButtons").style.display = "flex";
        showToast("Admin Mode Activated");
        checkConnection();
      } else {
        showToast("Access Denied", false);
      }
    });

    /* ========== ⏱️ Timer Logic ========== */
    let timers = [
      { boss: "VENATUS", loopHours: 10, remaining: 10 * 60 * 60 },
      { boss: "VIORENT", loopHours: 10, remaining: 10 * 60 * 60 },
      { boss: "EGO", loopHours: 21, remaining: 21 * 60 * 60 },
    ];

    function renderTimers() {
      const tbody = document.querySelector("#timerTable tbody");
      tbody.innerHTML = "";
      const now = new Date();
      const phNow = new Date(now.getTime() + 8 * 3600000);

      timers.forEach((t) => {
        const tr = document.createElement("tr");

        const boss = document.createElement("td");
        boss.textContent = t.boss;
        tr.appendChild(boss);

        const cd = document.createElement("td");
        cd.classList.add("countdown");
        cd.textContent = formatTime(t.remaining);
        tr.appendChild(cd);

        const respawn = document.createElement("td");
        respawn.classList.add("respawn");
        const respawnTime = new Date(phNow.getTime() + t.remaining * 1000);
        respawn.textContent = respawnTime.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
        tr.appendChild(respawn);

        tbody.appendChild(tr);
      });
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      return `${h.toString().padStart(2, "0")}:${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
    }

    function tick() {
      timers.forEach((t) => {
        t.remaining--;
        if (t.remaining <= 0) t.remaining = t.loopHours * 3600;
      });
      renderTimers();
    }

    setInterval(tick, 1000);
    renderTimers();

    /* ========== 💾 JSONBin Sync (10min Auto-Save) ========== */
    async function saveTimers() {
      if (!isAdmin) return;
      try {
        await fetch(BIN_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
          body: JSON.stringify({ timers }),
        });
        showToast("Changes Saved");
      } catch {
        showToast("Save Failed", false);
      }
    }
    setInterval(saveTimers, 600000);

    /* Buttons */
    document.getElementById("saveChanges").onclick = saveTimers;
    document.getElementById("addTimer").onclick = () => {
      if (!isAdmin) return;
      const name = prompt("Enter Boss Name:");
      const hours = parseInt(prompt("Enter Loop Hours:"), 10);
      if (name && hours) {
        timers.push({ boss: name, loopHours: hours, remaining: hours * 3600 });
        renderTimers();
        showToast("Timer Added");
      }
    };
  </script>

</body>
