<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pookie Boss Timer</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#013220" />
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
}
</script>
<style>
body { font-family: sans-serif; background: #013220; color: #39FF14; text-align: center; margin: 0; }
#clock { font-size: 80px; color: red; margin-top: 20px; }
table { margin: 20px auto; border-collapse: collapse; width: 90%; max-width: 800px; }
th, td { border: 1px solid rgba(255,255,255,0.2); padding: 10px; }
button { background: rgba(15,81,50,0.6); color: #39FF14; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
#connection-status { position: fixed; top: 10px; right: 10px; }
</style>
</head>
<body>
<h1>Boss Respawn Schedule</h1>
<div id="clock">--:--:--</div>
<div id="connection-status">🟢 Connected</div>
<table>
<thead><tr><th>Boss</th><th>Countdown</th><th>Respawn Time</th><th>Actions</th></tr></thead>
<tbody id="timer-body"></tbody>
</table>
<script>
let timers = JSON.parse(localStorage.getItem("pookieTimers")||"[]");
if(timers.length===0){timers=[{name:"VENATUS",duration:36000,targetTime:Date.now()+36000*1000},{name:"VIORENT",duration:36000,targetTime:Date.now()+36000*1000},{name:"EGO",duration:75600,targetTime:Date.now()+75600*1000}];}
function render(){const tb=document.getElementById("timer-body");tb.innerHTML="";timers.forEach((t,i)=>{const r=Math.max(0,Math.ceil((t.targetTime-Date.now())/1000));const h=String(Math.floor(r/3600)).padStart(2,'0');const m=String(Math.floor((r%3600)/60)).padStart(2,'0');const s=String(r%60).padStart(2,'0');const tr=document.createElement("tr");tr.innerHTML=`<td>${t.name}</td><td>${h}:${m}:${s}</td><td>${new Date(t.targetTime).toLocaleString()}</td><td><button onclick="reset(${i})">Reset</button></td>`;tb.appendChild(tr);});}
function reset(i){timers[i].targetTime=Date.now()+timers[i].duration*1000;localStorage.setItem("pookieTimers",JSON.stringify(timers));render();}
function tick(){render();}
setInterval(tick,1000);render();
</script>
</body>
</html>
