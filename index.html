<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#003300" />
  <link rel="manifest" href="manifest.json" />
  <title>Boss Respawn Schedule</title>
  <style>
    body {
      font-family: "Courier New", monospace;
      background-color: #002b11;
      color: #00ff00;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    h1 {
      color: yellow;
      font-size: 2.5em;
      margin-top: 20px;
    }

    #phTime {
      color: #ff0000;
      font-size: 4em;
      font-weight: bold;
      text-shadow: 0 0 15px red;
      margin: 20px 0;
    }

    .subtitle {
      font-size: 0.9em;
      color: #aaffaa;
      margin-top: -10px;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 85%;
      background-color: #001a0a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px #003300;
    }

    th, td {
      padding: 14px;
      border-bottom: 2px solid #00ff00;
    }

    th {
      color: lime;
      font-size: 1.1em;
      font-weight: bold;
    }

    td {
      color: #00ff55;
      font-size: 1.2em;
      font-weight: bold;
      text-shadow: 0 0 8px #00ff55;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .action-btn {
      background-color: #003300;
      border: 1px solid #00ff00;
      color: #00ff00;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      margin: 2px;
    }

    .action-btn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    .login-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background-color: #002b11;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    .status {
      position: fixed;
      top: 20px;
      right: 130px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
      color: lime;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: lime;
    }

    .offline .status-dot {
      background-color: red;
    }

    .small-date {
      display: block;
      font-size: 0.8em;
      color: #66ff99;
      text-shadow: none;
    }

    .top-controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .control-btn {
      background-color: #002b11;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .control-btn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    /* Modal styling */
    #modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
    }

    #modalContent {
      background: #001a0a;
      padding: 20px 30px;
      border: 2px solid #00ff00;
      border-radius: 12px;
      width: 300px;
      text-align: left;
      box-shadow: 0 0 20px #00ff00;
    }

    #modalContent h2 {
      color: yellow;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      color: #aaffaa;
    }

    input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #00ff00;
      background: #002b11;
      color: #00ff00;
      font-weight: bold;
    }

    .modal-btn {
      margin-top: 12px;
      padding: 8px 14px;
      border: 1px solid #00ff00;
      background: #003300;
      color: #00ff00;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 48%;
      transition: 0.2s;
    }

    .modal-btn:hover {
      background: #00ff00;
      color: #002b11;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="status"><div class="status-dot"></div><span id="statusText">Connected</span></div>
  <button class="login-btn">Admin Login</button>

  <h1>Boss Respawn Schedule</h1>
  <div class="subtitle">Philippine Time (UTC+8)</div>
  <div id="phTime">--:--:--</div>

  <div class="top-controls">
    <button class="control-btn" onclick="openModal()">+ Add Timer</button>
    <button class="control-btn" onclick="manualSave()">💾 Save Changes</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
        <th>ACTIONS</th>
      </tr>
    </thead>
    <tbody id="bossTable"></tbody>
  </table>

  <!-- Modal for adding timer -->
  <div id="modal">
    <div id="modalContent">
      <h2>Add New Timer</h2>
      <label for="bossName">Boss Name:</label>
      <input type="text" id="bossName" placeholder="Enter boss name" />
      <label for="bossMinutes">Respawn Duration (minutes):</label>
      <input type="number" id="bossMinutes" placeholder="Enter minutes" />
      <div class="modal-actions">
        <button class="modal-btn" onclick="saveModal()">Add</button>
        <button class="modal-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const BIN_ID = "6737a5aead19ca34f8b35a9c";
    const JSON_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
    const JSON_WRITE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
    const API_KEY = "$2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi";

    let bossData = [];
    let isOnline = true;
    const REFRESH_INTERVAL = 4 * 60 * 1000;
    const table = document.getElementById("bossTable");
    const statusDot = document.querySelector(".status-dot");
    const statusText = document.getElementById("statusText");

    function updatePHTime() {
      const options = { timeZone: "Asia/Manila", hour12: true, hour: "numeric", minute: "numeric", second: "numeric" };
      document.getElementById("phTime").textContent = new Date().toLocaleTimeString("en-US", options);
    }
    setInterval(updatePHTime, 1000);

    async function fetchBossData() {
      try {
        const res = await fetch(JSON_URL);
        const json = await res.json();
        bossData = json.record.bosses || [];
        localStorage.setItem("bossDataCache", JSON.stringify(bossData));
        renderTable();
      } catch {
        const cached = localStorage.getItem("bossDataCache");
        if (cached) bossData = JSON.parse(cached);
        renderTable();
      }
    }

    async function saveBossData() {
      await fetch(JSON_WRITE_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify({ bosses: bossData }),
      });
    }

    function renderTable() {
      table.innerHTML = "";
      if (!bossData.length) return (table.innerHTML = `<tr><td colspan="4">No data</td></tr>`);
      bossData.forEach((boss, index) => {
        const respawn = new Date(boss.respawn);
        const dateStr = respawn.toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });
        const shortDate = respawn.toLocaleString("en-US", { month: "short", day: "numeric" });
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span contenteditable="true" onblur="updateName(${index}, this.textContent.trim())">${boss.name}</span></td>
          <td class="countdown" data-time="${respawn}">
            --:--:-- <span class="small-date">${shortDate}</span>
          </td>
          <td contenteditable="true" onblur="updateRespawn(${index}, this.textContent.trim())">${dateStr}</td>
          <td>
            <button class="action-btn" onclick="adjustTime(${index})">Adjust</button>
            <button class="action-btn" onclick="jumpTo(${index})">Jump</button>
            <button class="action-btn" onclick="resetTimer(${index})">Reset</button>
          </td>`;
        table.appendChild(row);
      });
    }

    function updateCountdowns() {
      const now = Date.now();
      document.querySelectorAll(".countdown").forEach(el => {
        const target = new Date(el.dataset.time).getTime();
        const date = new Date(el.dataset.time);
        const shortDate = date.toLocaleString("en-US", { month: "short", day: "numeric" });
        let diff = target - now;
        if (diff < 0) diff = 0;
        const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, "0");
        const m = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, "0");
        const s = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");
        el.innerHTML = `${h}:${m}:${s} <span class="small-date">${shortDate}</span>`;
      });
    }
    setInterval(updateCountdowns, 1000);

    async function updateName(index, newName) {
      if (!newName) return;
      bossData[index].name = newName;
    }

    async function updateRespawn(index, newValue) {
      const parsedDate = new Date(newValue);
      if (isNaN(parsedDate)) return alert("Invalid date format. Use valid format.");
      bossData[index].respawn = parsedDate.toISOString();
    }

    async function adjustTime(index) {
      const newTime = prompt("Enter new respawn time (HH:MM 24-hour):");
      if (!newTime || !/^\d{1,2}:\d{2}$/.test(newTime)) return;
      const [h, m] = newTime.split(":").map(Number);
      const now = new Date();
      const newRespawn = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
      bossData[index].respawn = newRespawn.toISOString();
      renderTable();
    }

    async function jumpTo(index) {
      const addMins = parseInt(prompt("Jump forward by how many minutes?"), 10);
      if (isNaN(addMins)) return;
      const respawn = new Date(bossData[index].respawn);
      respawn.setMinutes(respawn.getMinutes() + addMins);
      bossData[index].respawn = respawn.toISOString();
      renderTable();
    }

    async function resetTimer(index) {
      if (!confirm(`Reset ${bossData[index].name}?`)) return;
      const now = new Date();
      now.setMinutes(now.getMinutes() + 30);
      bossData[index].respawn = now.toISOString();
      renderTable();
    }

    function openModal() { document.getElementById("modal").style.display = "flex"; }
    function closeModal() { document.getElementById("modal").style.display = "none"; }

    async function saveModal() {
      const name = document.getElementById("bossName").value.trim();
      const mins = parseInt(document.getElementById("bossMinutes").value.trim(), 10);
      if (!name || isNaN(mins)) return alert("Please fill both fields correctly.");
      const now = new Date();
      now.setMinutes(now.getMinutes() + mins);
      bossData.push({ name, respawn: now.toISOString() });
      renderTable();
      closeModal();
    }

    async function manualSave() {
      await saveBossData();
      alert("✅ Changes saved to JSONBin!");
    }

    fetchBossData();
    setInterval(fetchBossData, REFRESH_INTERVAL);
  </script>
</body>
</html>
