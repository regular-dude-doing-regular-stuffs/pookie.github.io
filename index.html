<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pookie Boss Timer</title>

  <!-- External CSS (kept linked for easy editing) -->
  <link rel="stylesheet" href="web.css">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#013220">

  <!-- Service worker registration (PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(e => console.warn('SW registration failed', e));
      });
    }
  </script>

  <style>
    /* Embedded background will be applied via inline JS to keep markup clean.
       This block contains layout helpers and overlay styling. */

    html, body { height: 100%; margin: 0; padding: 0; }
    body { position: relative; overflow-x: hidden; background-color: #013220; }

    /* The fixed background element (keeps content accessible even if JS fails) */
    #bg-fixed {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: -3;
      will-change: transform, background-position;
      pointer-events: none;
      transform: translateZ(0);
    }

    /* Overlay behind content for readability (15% opacity) */
    #bg-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.15); /* 15% dark overlay */
      z-index: -2;
      pointer-events: none;
    }

    /* Positioning helpers */
    #topControls { position: relative; }
    #connection-status { position: absolute; right: 10px; top: 48px; font-weight: 700; display: none; }
    #connection-status .dot { font-size: 18px; margin-right: 6px; }
    #toast { z-index: 3000; }

    /* Make respawn bold as requested */
    .respawn strong { font-weight: 800; }

    /* Small responsive tweaks to avoid background overflow artifacts */
    @media (max-width: 600px) {
      h1 { font-size: 28px; }
      #clock { font-size: 56px; }
      .countdown { font-size: 36px; }
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div id="bg-fixed" aria-hidden="true"></div>
  <div id="bg-overlay" aria-hidden="true"></div>

  <!-- Title + Clock -->
  <h1 style="color:yellow;">Boss Respawn Schedule</h1>
  <div id="clock-label" style="color:#00ff66; margin-bottom:6px;">Philippine Time (UTC+8)</div>
  <div id="clock" style="font-size:100px; color:red; text-shadow: 0 0 25px red, 0 0 45px #ff4d4d;">--:--:-- --</div>

  <!-- Top controls: Admin login + connection status -->
  <div id="topControls">
    <button id="admin-login" class="admin-btn" style="position:absolute; right:10px; top:10px;">Admin Login</button>

    <div id="connection-status" aria-live="polite" role="status" style="right:10px; top:60px;">
      <span id="conn-dot" class="dot">🔴</span>
      <span id="conn-text">Disconnected from JSONBin</span>
    </div>
  </div>

  <!-- Admin Actions -->
  <div id="admin-actions" style="display:none; margin-top: 12px;">
    <button id="add-timer" class="admin-btn">Add New Timer</button>
    <button id="save-timers" class="save-btn">Save Changes</button>
  </div>

  <!-- Timers table -->
  <table id="timer-table" style="width:90%; margin:18px auto; border-collapse:collapse;">
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
        <th>ACTIONS</th>
      </tr>
    </thead>
    <tbody id="timer-body"></tbody>
  </table>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite" style="visibility:hidden;">✅ All changes saved successfully!</div>

  <!-- === SCRIPT: timers, JSONBin sync, admin, toasts, connection status, parallax background === -->
  <script>
  /************************************************************************
   * Pookie Boss Timer - Final (neatly formatted)
   * Replace BG_DATA_URI with a real "data:image/png;base64,..." string.
   ************************************************************************/

  /* ------------------------
     CONFIGURATION
     ------------------------ */
  const JSONBIN_URL = "https://api.jsonbin.io/v3/b/6909f9efae596e708f43d542";
  const API_KEY = "$2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi"; // embedded as requested
  const POLL_INTERVAL_MS = 10000; // 10s viewers
  const CONNECTION_RETEST_MS = 5 * 60 * 1000; // 5 minutes admin recheck
  const PASSWORD = "Iamtoogood009";
  const PARALLAX_SPEED = 0.15; // slight parallax

  /* ------------------------
     IMPORTANT: Insert your Base64 data URI here (single long string)
     Example: const BG_DATA_URI = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...";
     Replace the placeholder below with the full contents of bg-data-uri.txt you generated locally.
     ------------------------ */
  const BG_DATA_URI = "PASTE_YOUR_BASE64_DATA_URI_HERE";

  /* ------------------------
     Application state & defaults
     ------------------------ */
  let adminMode = false;
  let connectionOK = false;
  let connectionRetestTimer = null;
  let isApplyingRemote = false;
  let timers = (function(){
    const saved = localStorage.getItem("pookieTimers");
    if (!saved) {
      const now = Date.now();
      return [
        { name: "VENATUS", duration: 10 * 3600, targetTime: now + 10 * 3600 * 1000 },
        { name: "VIORENT", duration: 10 * 3600, targetTime: now + 10 * 3600 * 1000 },
        { name: "EGO", duration: 21 * 3600, targetTime: now + 21 * 3600 * 1000 }
      ];
    }
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed)) {
        return parsed.map(t => {
          if (t.targetTime) return { name: t.name, duration: t.duration, targetTime: t.targetTime };
          if (t.remaining != null) return { name: t.name, duration: t.duration, targetTime: Date.now() + (t.remaining * 1000) };
          return { name: t.name, duration: t.duration, targetTime: Date.now() + t.duration * 1000 };
        });
      }
    } catch(e) { console.warn("parse error", e); }
    const now = Date.now();
    return [
      { name: "VENATUS", duration: 10 * 3600, targetTime: now + 10 * 3600 * 1000 },
      { name: "VIORENT", duration: 10 * 3600, targetTime: now + 10 * 3600 * 1000 },
      { name: "EGO", duration: 21 * 3600, targetTime: now + 21 * 3600 * 1000 }
    ];
  })();

  /* ------------------------
     Utilities
     ------------------------ */
  function escapeHtml(s) {
    return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }

  function getRemainingSec(timer) {
    return Math.max(0, Math.ceil((timer.targetTime - Date.now()) / 1000));
  }

  function fmtTime(sec) {
    if (sec < 0) sec = 0;
    const h = String(Math.floor(sec / 3600)).padStart(2, "0");
    const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
    const s = String(sec % 60).padStart(2, "0");
    return `${h}:${m}:${s}`;
  }

  function formatShortPH(ms) {
    const d = new Date(ms);
    const s = d.toLocaleString("en-US", {
      timeZone: "Asia/Manila",
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit",
      hour12: true
    });
    return s.replace(',', ' –');
  }

  /* ------------------------
     Clock (header) - Philippines 12-hour
     ------------------------ */
  function updateClock() {
    const now = new Date().toLocaleTimeString("en-US", { timeZone: "Asia/Manila", hour12: true });
    document.getElementById("clock").textContent = now;
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* ------------------------
     Toast UI
     ------------------------ */
  function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.visibility = "visible";
    if (type === "success") {
      toast.style.background = "linear-gradient(90deg, rgba(0,255,170,0.12), rgba(0,255,170,0.06))";
      toast.style.color = "#001f00";
      toast.style.border = "1px solid rgba(0,255,170,0.25)";
    } else {
      toast.style.background = "linear-gradient(90deg, rgba(255,20,20,0.14), rgba(255,50,50,0.06))";
      toast.style.color = "#2a0000";
      toast.style.border = "1px solid rgba(255,20,20,0.25)";
    }
    // Slide up/fade: use show class from web.css if present; fallback to timeout hide
    toast.classList.add("show");
    setTimeout(() => {
      toast.classList.remove("show");
      toast.style.visibility = "hidden";
    }, 3000);
  }

  /* ------------------------
     Render timers
     ------------------------ */
  function renderTimers() {
    const tbody = document.getElementById("timer-body");
    tbody.innerHTML = "";
    timers.forEach((t, i) => {
      const remaining = getRemainingSec(t);
      const respawnPH = formatShortPH(t.targetTime);
      let color = "#00ff66";
      if (remaining <= 60 * 20) color = "red";
      else if (remaining <= 60 * 60) color = "orange";
      else if (remaining <= 3 * 60 * 60) color = "yellow";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="timer-name" style="color:${color}">${escapeHtml(t.name)}</td>
        <td class="countdown" id="timer-${i}">${fmtTime(remaining)}</td>
        <td class="respawn" id="respawn-${i}"><strong>${respawnPH}</strong></td>
        <td>
          ${adminMode ? `
            <button class="admin-btn" onclick="editTimer(${i})">Edit</button>
            <button class="admin-btn" onclick="jumpToTime(${i})">Jump To Time</button>
          ` : ""}
        </td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("admin-actions").style.display = adminMode ? "block" : "none";
    document.getElementById("connection-status").style.display = adminMode ? "block" : "none";
  }

  /* ------------------------
     Tick & loop logic
     ------------------------ */
  function tickAndLoop() {
    const now = Date.now();
    let changed = false;
    timers.forEach(t => {
      if (t.targetTime <= now) {
        while (t.targetTime <= now) {
          t.targetTime += t.duration * 1000;
        }
        changed = true;
      }
    });
    if (changed) localStorage.setItem("pookieTimers", JSON.stringify(timers));
    renderTimers();
  }
  setInterval(tickAndLoop, 1000);

  /* ------------------------
     JSONBin: fetch & push
     ------------------------ */
  async function fetchBin() {
    try {
      const res = await fetch(JSONBIN_URL + "/latest", {
        method: "GET",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY }
      });
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      const json = await res.json();
      return json && json.record ? json.record : json;
    } catch (e) {
      console.warn("fetchBin error", e);
      return null;
    }
  }

  async function pushBin(payload) {
    try {
      const res = await fetch(JSONBIN_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(res.status + " " + res.statusText + " - " + txt);
      }
      return true;
    } catch (e) {
      console.warn("pushBin error", e);
      return false;
    }
  }

  /* ------------------------
     Pull remote & apply
     ------------------------ */
  async function pullAndApplyRemote() {
    const remote = await fetchBin();
    if (!remote || !Array.isArray(remote.timers)) return;
    const remoteTimers = remote.timers.map(rt => {
      if (rt.targetTime) return { name: rt.name, duration: rt.duration, targetTime: rt.targetTime };
      if (rt.remaining != null) return { name: rt.name, duration: rt.duration, targetTime: Date.now() + rt.remaining * 1000 };
      return { name: rt.name, duration: rt.duration, targetTime: Date.now() + rt.duration * 1000 };
    });
    if (JSON.stringify(remoteTimers) !== JSON.stringify(timers)) {
      isApplyingRemote = true;
      timers = remoteTimers.map(t => Object.assign({}, t));
      localStorage.setItem("pookieTimers", JSON.stringify(timers));
      renderTimers();
      isApplyingRemote = false;
    }
  }

  (async () => {
    const remote = await fetchBin();
    if (remote && Array.isArray(remote.timers)) {
      timers = remote.timers.map(rt => {
        if (rt.targetTime) return { name: rt.name, duration: rt.duration, targetTime: rt.targetTime };
        if (rt.remaining != null) return { name: rt.name, duration: rt.duration, targetTime: Date.now() + rt.remaining * 1000 };
        return { name: rt.name, duration: rt.duration, targetTime: Date.now() + rt.duration * 1000 };
      });
      localStorage.setItem("pookieTimers", JSON.stringify(timers));
    }
    renderTimers();
  })();

  setInterval(() => pullAndApplyRemote(), POLL_INTERVAL_MS);

  /* ------------------------
     Connection test & indicator (admin-only)
     ------------------------ */
  async function testConnection(showToastFlag = true) {
    try {
      const res = await fetch(JSONBIN_URL + "/latest", {
        method: "GET",
        headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY }
      });
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      connectionOK = true;
      updateConnectionIndicator(true);
      if (showToastFlag) showToast("✅ Connected to JSONBin", "success");
      return true;
    } catch (e) {
      connectionOK = false;
      updateConnectionIndicator(false);
      if (showToastFlag) showToast("❌ Failed to connect — check API key or bin URL", "error");
      console.warn("connection test failed", e);
      return false;
    }
  }

  function updateConnectionIndicator(ok) {
    const dot = document.getElementById("conn-dot");
    const txt = document.getElementById("conn-text");
    if (ok) {
      dot.textContent = "🟢";
      txt.textContent = "Connected to JSONBin";
    } else {
      dot.textContent = "🔴";
      txt.textContent = "Disconnected from JSONBin";
    }
  }

  /* ------------------------
     Admin login flow
     ------------------------ */
  function setAdminMode(on) {
    adminMode = on;
    document.getElementById("admin-actions").style.display = on ? "block" : "none";
    document.getElementById("connection-status").style.display = on ? "block" : "none";
    renderTimers();
    if (on) {
      testConnection(true);
      if (connectionRetestTimer) clearInterval(connectionRetestTimer);
      connectionRetestTimer = setInterval(() => testConnection(false), CONNECTION_RETEST_MS);
    } else {
      if (connectionRetestTimer) { clearInterval(connectionRetestTimer); connectionRetestTimer = null; }
    }
  }

  document.getElementById("admin-login").addEventListener("click", async () => {
    const pass = prompt("Enter Admin Password:");
    if (pass === PASSWORD) {
      setAdminMode(true);
      localStorage.setItem("pookieAdmin","true");
      showToast("Admin mode enabled","success");
    } else {
      alert("Incorrect password!");
    }
  });

  if (localStorage.getItem("pookieAdmin")==="true") {
    setAdminMode(true);
  }

  /* ------------------------
     Admin actions: edit, jump, add, save
     ------------------------ */
  async function autoPushIfConnected() {
    if (!connectionOK) return false;
    if (isApplyingRemote) return false;
    const payload = { timers: timers, lastUpdated: Date.now() };
    const ok = await pushBin(payload);
    return ok;
  }

  async function editTimer(i) {
    const newName = prompt("Enter new name:", timers[i].name);
    if (newName) timers[i].name = newName;
    const newDuration = prompt("Enter new duration in hours:", (timers[i].duration/3600).toString());
    if (newDuration && !isNaN(newDuration)) {
      const hours = Number(newDuration);
      timers[i].duration = Math.round(hours * 3600);
      // targetTime = header clock (Date.now()) + duration
      timers[i].targetTime = Date.now() + timers[i].duration * 1000;
    }
    localStorage.setItem("pookieTimers", JSON.stringify(timers));
    renderTimers();
    if (!isApplyingRemote) {
      const ok = await autoPushIfConnected();
      if (ok) showToast("Auto-saved changes","success"); else if (connectionOK===false) showToast("Auto-save failed (disconnected)","error");
    }
  }

  async function jumpToTime(i) {
    const currentRemaining = getRemainingSec(timers[i]);
    const newRemaining = prompt("Jump to remaining time (HH:MM:SS):", fmtTime(currentRemaining));
    if (!newRemaining) return;
    const parts = newRemaining.split(":").map(Number);
    if (parts.length !== 3 || parts.some(p => Number.isNaN(p))) return alert("Invalid format. Use HH:MM:SS");
    const secs = parts[0]*3600 + parts[1]*60 + parts[2];
    timers[i].targetTime = Date.now() + secs * 1000;
    localStorage.setItem("pookieTimers", JSON.stringify(timers));
    renderTimers();
    if (!isApplyingRemote) {
      const ok = await autoPushIfConnected();
      if (ok) showToast("Auto-saved changes","success"); else if (connectionOK===false) showToast("Auto-save failed (disconnected)","error");
    }
  }

  document.getElementById("add-timer").addEventListener("click", async () => {
    const name = prompt("Enter Boss Name:");
    if (!name) return;
    const hoursRaw = prompt("Enter Loop Duration (hours):", "10");
    const hours = parseFloat(hoursRaw);
    if (!hours || !Number.isFinite(hours) || hours <= 0) return alert("Invalid hours");
    const loopSecs = Math.round(hours * 3600);
    const newTimer = { name, duration: loopSecs, targetTime: Date.now() + loopSecs * 1000 };
    timers.push(newTimer);
    localStorage.setItem("pookieTimers", JSON.stringify(timers));
    renderTimers();
    if (!isApplyingRemote) {
      const ok = await autoPushIfConnected();
      if (ok) showToast("Auto-saved changes","success"); else if (connectionOK===false) showToast("Auto-save failed (disconnected)","error");
    }
  });

  document.getElementById("save-timers").addEventListener("click", async () => {
    if (!connectionOK) { showToast("Cannot save: disconnected from JSONBin","error"); return; }
    const ok = await pushBin({ timers: timers, lastUpdated: Date.now() });
    if (ok) showToast("Saved to JSONBin","success"); else showToast("Save failed: check API key","error");
  });

  /* ------------------------
     Parallax background setup (safe approach)
     - uses background-position to create subtle parallax motion
     ------------------------ */
  (function setupBackground(){
    const bg = document.getElementById('bg-fixed');
    // If BG_DATA_URI is not replaced, show a fallback solid background color (keeps page visible)
    if (!BG_DATA_URI || BG_DATA_URI === "PASTE_YOUR_BASE64_DATA_URI_HERE") {
      bg.style.backgroundImage = "none";
      bg.style.backgroundColor = "#001a12"; // fallback deep green
      return;
    }
    bg.style.backgroundImage = `url("${BG_DATA_URI}")`;
    bg.style.backgroundPosition = "center center";

    // On scroll, shift background-position vertically by a small factor (parallax)
    window.addEventListener('scroll', function() {
      const sc = window.scrollY || window.pageYOffset;
      const offset = sc * PARALLAX_SPEED;
      // Adjust background-position with center and calc
      bg.style.backgroundPosition = `center ${50 + (offset/ window.innerHeight * 100)}%`;
      // (We use percent so it's responsive)
    }, { passive: true });

    // Set initial position
    (function(){ const sc = window.scrollY || window.pageYOffset; const offset = sc * PARALLAX_SPEED; bg.style.backgroundPosition = `center ${50 + (offset/ window.innerHeight * 100)}%`; })();
  })();

  /* ------------------------
     Debug helpers (optional)
     ------------------------ */
  window._pookie = {
    getTimers: () => timers,
    pushNow: async () => await pushBin({ timers: timers, lastUpdated: Date.now() }),
    testConnectionNow: async () => await testConnection(true)
  };

  </script>
</body>
</html>
