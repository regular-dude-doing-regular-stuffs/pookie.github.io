<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pookie Boss Timer</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#013220">
  <style>
    body {
      background-color: #013220;
      color: teal;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      font-size: 50px;
      margin-top: 20px;
      color: teal;
      text-shadow: 0 0 10px #00bfa5;
    }
    #clock {
      font-size: 100px;
      color: red;
      text-shadow: 0 0 25px red;
    }
    #clock-label {
      color: teal;
      text-shadow: 0 0 10px teal;
      margin-bottom: 20px;
    }
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      border: 2px solid teal;
      padding: 10px;
      text-align: center;
    }
    th {
      font-size: 24px;
    }
    .timer-name {
      font-size: 24px;
      font-weight: bold;
      transition: color 0.5s, text-shadow 0.5s;
    }
    .countdown {
      font-size: 48px;
      color: teal;
      text-shadow: 0 0 10px teal;
    }
    .respawn {
      font-size: 20px;
      color: teal;
    }
    .admin-btn, .save-btn {
      background-color: #0f5132;
      color: teal;
      border: none;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      cursor: pointer;
    }
    .admin-btn:hover, .save-btn:hover {
      background-color: #198754;
    }
    #admin-login {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    #toast {
      visibility: hidden;
      min-width: 300px;
      margin-left: -150px;
      background-color: rgba(0, 128, 128, 0.95);
      color: white;
      text-align: center;
      border-radius: 8px;
      padding: 16px;
      position: fixed;
      left: 50%;
      bottom: -100px;
      font-size: 17px;
      text-shadow: 0 0 10px white;
      box-shadow: 0 0 15px teal;
      transition: all 0.6s ease;
    }
    #toast.show {
      visibility: visible;
      bottom: 50px;
    }
  </style>
</head>
<body>
  <button id="admin-login" class="admin-btn">Admin Login</button>
  <h1>Boss Respawn Schedule</h1>
  <div id="clock"></div>
  <div id="clock-label">Philippine Time (UTC+8)</div>
  <table id="timerTable">
    <tr>
      <th>BOSS</th>
      <th>COUNTDOWN TIMER</th>
      <th>RESPAWN DATE</th>
      <th class="admin-actions" style="display:none;">ACTIONS</th>
    </tr>
  </table>

  <div id="admin-actions" style="display:none;">
    <button id="addTimerBtn" class="admin-btn">Add New Timer</button>
    <button id="saveChangesBtn" class="save-btn">Save Changes</button>
  </div>

  <div id="toast">✅ All changes saved successfully!</div>

  <script>
    const password = "Iamtoogood009";
    let isAdmin = false;
    let timers = JSON.parse(localStorage.getItem("pookieTimers")) || [
      { name: "VENATUS", loopHours: 10 },
      { name: "VIORENT", loopHours: 10 },
      { name: "EGO", loopHours: 21 }
    ];

    function showToast() {
      const toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(() => toast.className = toast.className.replace("show", ""), 3000);
    }

    function formatTime(ms) {
      let totalSeconds = Math.floor(ms / 1000);
      let hrs = Math.floor(totalSeconds / 3600);
      let mins = Math.floor((totalSeconds % 3600) / 60);
      let secs = totalSeconds % 60;
      return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function updateClock() {
      const now = new Date();
      const phTime = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Manila" }));
      let hours = phTime.getHours();
      const minutes = phTime.getMinutes().toString().padStart(2, '0');
      const seconds = phTime.getSeconds().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }

    function saveTimers() {
      localStorage.setItem("pookieTimers", JSON.stringify(timers));
      showToast();
    }

    function createTimerRow(timer, index) {
      const now = Date.now();
      if (!timer.startTime) timer.startTime = now;
      const elapsed = now - timer.startTime;
      const loopMs = timer.loopHours * 3600000;
      const remaining = loopMs - (elapsed % loopMs);
      const nextRespawn = new Date(now + remaining);

      const tr = document.createElement("tr");
      const nameTd = document.createElement("td");
      nameTd.className = "timer-name";
      nameTd.textContent = timer.name;

      const countdownTd = document.createElement("td");
      countdownTd.className = "countdown";

      const respawnTd = document.createElement("td");
      respawnTd.className = "respawn";

      const actionsTd = document.createElement("td");
      actionsTd.style.display = isAdmin ? "table-cell" : "none";
      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.className = "admin-btn";
      editBtn.onclick = () => {
        const newName = prompt("Edit Boss Name:", timer.name);
        if (newName) {
          timer.name = newName;
          renderTimers();
        }
      };
      const jumpBtn = document.createElement("button");
      jumpBtn.textContent = "Jump To Time";
      jumpBtn.className = "admin-btn";
      jumpBtn.onclick = () => {
        const input = prompt("Enter new remaining time (HH:MM:SS):");
        if (!input) return;
        const [h, m, s] = input.split(":").map(Number);
        const ms = ((h * 3600) + (m * 60) + s) * 1000;
        timer.startTime = Date.now() - (timer.loopHours * 3600000 - ms);
        saveTimers();
        renderTimers();
      };
      actionsTd.append(editBtn, jumpBtn);

      tr.append(nameTd, countdownTd, respawnTd, actionsTd);
      document.getElementById("timerTable").appendChild(tr);

      function updateTimer() {
        const elapsed = Date.now() - timer.startTime;
        const remaining = loopMs - (elapsed % loopMs);
        const hrs = remaining / 3600000;

        countdownTd.textContent = formatTime(remaining);
        const nextRespawnTime = new Date(Date.now() + remaining);
        respawnTd.textContent = nextRespawnTime.toLocaleString("en-US", { timeZone: "Asia/Manila", weekday: "long", month: "long", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true });

        if (hrs <= 3 && hrs > 1) nameTd.style.color = "yellow";
        else if (hrs <= 1 && hrs > 0.333) nameTd.style.color = "orange";
        else if (hrs <= 0.333) nameTd.style.color = "red";
        else nameTd.style.color = "teal";
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    function renderTimers() {
      const table = document.getElementById("timerTable");
      table.querySelectorAll("tr:not(:first-child)").forEach(tr => tr.remove());
      timers.forEach((t, i) => createTimerRow(t, i));
    }

    document.getElementById("admin-login").onclick = () => {
      const input = prompt("Enter admin password:");
      if (input === password) {
        isAdmin = true;
        document.getElementById("admin-actions").style.display = "block";
        document.querySelectorAll(".admin-actions").forEach(el => el.style.display = "table-cell");
        renderTimers();
      } else alert("Incorrect password.");
    };

    document.getElementById("addTimerBtn").onclick = () => {
      const name = prompt("Enter Boss Name:");
      const hours = parseInt(prompt("Enter Loop Duration (hours):"), 10);
      if (name && hours > 0) {
        timers.push({ name, loopHours: hours, startTime: Date.now() });
        saveTimers();
        renderTimers();
      }
    };

    document.getElementById("saveChangesBtn").onclick = saveTimers;

    renderTimers();
    setInterval(updateClock, 1000);
    updateClock();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
