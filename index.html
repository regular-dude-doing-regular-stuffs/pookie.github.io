<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss Respawn Schedule</title>
  <meta name="theme-color" content="#002b11">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: "Courier New", monospace;
      background-color: #002b11;
      color: #00ff00;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    h1 {
      color: yellow;
      font-size: 2.5em;
      margin-top: 20px;
    }

    #phTime {
      color: red;
      font-size: 3.5em;
      font-weight: bold;
      text-shadow: 0 0 20px red;
      margin: 20px 0;
    }

    .subtitle {
      color: #aaffaa;
      font-size: 0.9em;
    }

    table {
      margin: 20px auto;
      width: 80%;
      border-collapse: collapse;
      background-color: #001a0a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px #003300;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #00ff00;
    }

    th {
      color: lime;
      font-size: 1.1em;
    }

    td {
      color: #00ff66;
      font-size: 1.2em;
      font-weight: bold;
      text-shadow: 0 0 8px #00ff66;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .action-btn {
      background-color: #002b11;
      border: 1px solid #00ff00;
      color: #00ff00;
      font-weight: bold;
      border-radius: 6px;
      padding: 5px 10px;
      margin: 2px;
      cursor: pointer;
      transition: 0.2s;
    }

    .action-btn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    #addTimerBtn {
      background-color: #003300;
      border: 2px solid #00ff00;
      color: #00ff00;
      font-weight: bold;
      border-radius: 10px;
      padding: 10px 20px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    #addTimerBtn:hover {
      background-color: #00ff00;
      color: #002b11;
    }

    .login-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background-color: #002b11;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .status {
      position: fixed;
      top: 20px;
      right: 130px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9em;
      color: lime;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: lime;
    }

    .offline .status-dot {
      background-color: red;
    }
  </style>
</head>
<body>
  <div class="status">
    <div class="status-dot"></div>
    <span id="statusText">Connected</span>
  </div>
  <button class="login-btn">Admin Login</button>

  <h1>Boss Respawn Schedule</h1>
  <div class="subtitle">Philippine Time (UTC+8)</div>
  <div id="phTime">--:--:--</div>

  <table>
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
        <th>ACTIONS</th>
      </tr>
    </thead>
    <tbody id="bossTable"></tbody>
  </table>

  <button id="addTimerBtn">+ Add Timer</button>

  <script>
    const JSON_URL = "https://api.jsonbin.io/v3/b/6737a5aead19ca34f8b35a9c/latest";
    const table = document.getElementById("bossTable");
    const statusDot = document.querySelector(".status-dot");
    const statusText = document.getElementById("statusText");

    let bossData = [];
    let isOnline = navigator.onLine;

    // Philippine Time Display
    function updatePHTime() {
      const options = { timeZone: "Asia/Manila", hour12: true, hour: "2-digit", minute: "2-digit", second: "2-digit" };
      document.getElementById("phTime").textContent = new Date().toLocaleTimeString("en-US", options);
    }
    setInterval(updatePHTime, 1000);

    // Default 3 Bosses
    function defaultBossData() {
      return [
        { name: "Lordadine", respawn: Date.now() + 3600000 },
        { name: "Vardanos", respawn: Date.now() + 5400000 },
        { name: "Zaros", respawn: Date.now() + 7200000 }
      ];
    }

    // Render Table
    function renderTable() {
      table.innerHTML = "";
      bossData.forEach((boss, index) => {
        const respawn = new Date(boss.respawn);
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${boss.name}</td>
          <td class="countdown" data-time="${respawn}">--:--:--</td>
          <td>${respawn.toLocaleString("en-US", { hour: "numeric", minute: "2-digit", hour12: true })}</td>
          <td>
            <button class="action-btn" onclick="resetTimer(${index})">Reset</button>
            <button class="action-btn" onclick="editTimer(${index})">Edit</button>
            <button class="action-btn" onclick="deleteTimer(${index})">Delete</button>
          </td>`;
        table.appendChild(row);
      });
    }

    // Countdown Update
    function updateCountdowns() {
      const now = new Date().getTime();
      document.querySelectorAll(".countdown").forEach(el => {
        const target = new Date(el.dataset.time).getTime();
        let diff = target - now;
        if (diff < 0) diff = 0;

        const h = String(Math.floor(diff / (1000 * 60 * 60))).padStart(2, "0");
        const m = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, "0");
        const s = String(Math.floor((diff / 1000) % 60)).padStart(2, "0");

        el.textContent = `${h}:${m}:${s}`;
      });
    }

    // Fetch or Cache
    async function fetchBossData() {
      try {
        const res = await fetch(JSON_URL);
        const json = await res.json();
        bossData = json.record?.bosses || json.bosses || defaultBossData();
        localStorage.setItem("bossDataCache", JSON.stringify(bossData));
        renderTable();
      } catch {
        const cached = localStorage.getItem("bossDataCache");
        bossData = cached ? JSON.parse(cached) : defaultBossData();
        renderTable();
      }
    }

    // Timer Actions
    function resetTimer(index) {
      bossData[index].respawn = Date.now() + 3600000;
      localStorage.setItem("bossDataCache", JSON.stringify(bossData));
      renderTable();
    }

    function editTimer(index) {
      const newName = prompt("Enter new boss name:", bossData[index].name);
      if (newName) bossData[index].name = newName;
      localStorage.setItem("bossDataCache", JSON.stringify(bossData));
      renderTable();
    }

    function deleteTimer(index) {
      if (confirm("Delete this timer?")) {
        bossData.splice(index, 1);
        localStorage.setItem("bossDataCache", JSON.stringify(bossData));
        renderTable();
      }
    }

    document.getElementById("addTimerBtn").addEventListener("click", () => {
      const name = prompt("Enter boss name:");
      if (!name) return;
      bossData.push({ name, respawn: Date.now() + 3600000 });
      localStorage.setItem("bossDataCache", JSON.stringify(bossData));
      renderTable();
    });

    // Network Status
    function updateNetworkStatus() {
      isOnline = navigator.onLine;
      document.body.classList.toggle("offline", !isOnline);
      statusDot.style.backgroundColor = isOnline ? "lime" : "red";
      statusText.textContent = isOnline ? "Connected" : "Offline";
      if (isOnline) fetchBossData();
    }
    window.addEventListener("online", updateNetworkStatus);
    window.addEventListener("offline", updateNetworkStatus);

    // Initialize
    const cached = localStorage.getItem("bossDataCache");
    bossData = cached ? JSON.parse(cached) : defaultBossData();
    renderTable();
    fetchBossData();
    setInterval(updateCountdowns, 1000);
  </script>
</body>
</html>
