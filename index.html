<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pookie Boss Timer</title>
  <link rel="stylesheet" href="web.css" />
  <link rel="manifest" href="manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</head>
<body>
  <h1>Boss Respawn Schedule</h1>
  <div id="clock-label">Philippine Time (UTC+8)</div>
  <div id="clock"></div>

  <button id="admin-login" class="admin-btn">Admin Login</button>

  <div id="admin-actions" style="display:none;">
    <button id="add-timer" class="admin-btn">Add New Timer</button>
    <button id="save-timers" class="save-btn">Save Changes</button>
  </div>

  <table id="timer-table">
    <thead>
      <tr>
        <th>BOSS</th>
        <th>COUNTDOWN TIMER</th>
        <th>RESPAWN TIME</th>
        <th>ACTIONS</th>
      </tr>
    </thead>
    <tbody id="timer-body"></tbody>
  </table>

  <div id="toast">✅ All changes saved successfully!</div>

  <script>
    // === CONFIGURATION ($2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi) ===
    const JSONBIN_URL = "https://api.jsonbin.io/v3/b/6909f9efae596e708f43d542";
    const API_KEY = "$2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi"; // <- REPLACE with your JSONBin secret key locally
    const POLL_INTERVAL_MS = 10000; // 10 seconds
    const PASSWORD = "Iamtoogood009";
    let adminMode = false;
    let isApplyingRemote = false; // flag to avoid loops

    // Local timers cache (will be loaded from JSONBin on start)
    let timers = [
      { name: "VENATUS", duration: 10 * 60 * 60, remaining: 10 * 60 * 60 },
      { name: "VIORENT", duration: 10 * 60 * 60, remaining: 10 * 60 * 60 },
      { name: "EGO", duration: 21 * 60 * 60, remaining: 21 * 60 * 60 }
    ];

    // --- Utilities ---
    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, "0");
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${h}:${m}:${s}`;
    }

    function updateClock() {
      const now = new Date().toLocaleTimeString("en-US", { timeZone: "Asia/Manila", hour12: true });
      document.getElementById("clock").textContent = now;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function showToast(msg = "✅ All changes saved successfully!") {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function calculateRespawn(remaining) {
      const now = new Date();
      const respawn = new Date(now.getTime() + remaining * 1000);
      return respawn.toLocaleString("en-US", {
        timeZone: "Asia/Manila",
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }

    // --- Rendering ---
    function renderTimers() {
      const tbody = document.getElementById("timer-body");
      tbody.innerHTML = "";
      timers.forEach((t, i) => {
        const respawnTime = calculateRespawn(t.remaining);
        let color = "#00ff66";
        if (t.remaining <= 60 * 20) color = "red";
        else if (t.remaining <= 60 * 60) color = "orange";
        else if (t.remaining <= 3 * 60 * 60) color = "yellow";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="timer-name" style="color:${color}">${escapeHtml(t.name)}</td>
          <td class="countdown" id="timer-${i}">${formatTime(t.remaining)}</td>
          <td class="respawn" id="respawn-${i}">${respawnTime}</td>
          <td>
            ${adminMode ? `
              <button class="admin-btn" onclick="editTimer(${i})">Edit</button>
              <button class="admin-btn" onclick="jumpToTime(${i})">Jump To Time</button>
            ` : ""}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s){
      return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    }

    // --- Countdown ticking ---
    function tick() {
      timers.forEach(t => {
        t.remaining--;
        if (t.remaining <= 0) t.remaining = t.duration;
      });
      renderTimers();
    }
    setInterval(tick, 1000);

    // --- Remote sync with JSONBin ---
    async function fetchBin() {
      try {
        const res = await fetch(JSONBIN_URL + "/latest");
        if (!res.ok) return null;
        const data = await res.json();
        return data && data.record ? data.record : data;
      } catch (e) {
        console.warn("Fetch bin failed:", e);
        return null;
      }
    }

    async function pushBin(obj) {
      if (!API_KEY || API_KEY === "$2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi") {
        console.warn("API key not set; not pushing to JSONBin.");
        return false;
      }
      try {
        const res = await fetch(JSONBIN_URL, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": $2a$10$WYyO8b2IWZgwFczllVFuXOKxWm7MVesk9dSXSb0g.0/CMFmB.e1vi
          },
          body: JSON.stringify(obj)
        });
        return res.ok;
      } catch (e) {
        console.warn("Push to bin failed:", e);
        return false;
      }
    }

    async function pullAndApply() {
      const remote = await fetchBin();
      if (!remote) return;
      // basic merge: if remote.lastUpdated > local lastUpdated apply remote
      // We will consider remote as source of truth unless local had very recent admin edits
      if (JSON.stringify(remote.timers) !== JSON.stringify(timers)) {
        isApplyingRemote = true;
        timers = remote.timers.map(t=>Object.assign({}, t));
        renderTimers();
        isApplyingRemote = false;
      }
    }

    // initial load
    (async ()=>{
      const remote = await fetchBin();
      if (remote && remote.timers) {
        timers = remote.timers.map(t=>Object.assign({}, t));
      }
      renderTimers();
    })();

    // Polling
    setInterval(async ()=>{
      await pullAndApply();
    }, POLL_INTERVAL_MS);

    // --- Admin actions (auto-save on change) ---
    function setAdminMode(on) {
      adminMode = on;
      document.getElementById("admin-actions").style.display = on ? "block" : "none";
      renderTimers();
    }

    document.getElementById("admin-login").onclick = async () => {
      const pass = prompt("Enter Admin Password:");
      if (pass === PASSWORD) {
        setAdminMode(true);
        localStorage.setItem("pookieAdmin","true");
        showToast("Admin mode enabled");
      } else {
        alert("Incorrect password!");
      }
    };

    // Restore persisted admin flag
    if (localStorage.getItem("pookieAdmin")==="true") setAdminMode(true);

    // edit timer -> auto-save
    async function editTimer(i) {
      const newName = prompt("Enter new name:", timers[i].name);
      if (newName) timers[i].name = newName;
      const newDuration = prompt("Enter new duration in hours:", timers[i].duration / 3600);
      if (newDuration && !isNaN(newDuration)) {
        timers[i].duration = Math.round(newDuration * 3600);
        timers[i].remaining = timers[i].duration;
      }
      renderTimers();
      if (!isApplyingRemote) {
        const payload = { timers: timers, lastUpdated: Date.now() };
        const ok = await pushBin(payload);
        if (ok) showToast("Auto-saved changes");
      }
    }

    async function jumpToTime(i) {
      const newRemaining = prompt("Jump to remaining time (hh:mm:ss):", formatTime(timers[i].remaining));
      if (newRemaining) {
        const [h, m, s] = newRemaining.split(":").map(Number);
        timers[i].remaining = h * 3600 + m * 60 + s;
      }
      renderTimers();
      if (!isApplyingRemote) {
        const payload = { timers: timers, lastUpdated: Date.now() };
        const ok = await pushBin(payload);
        if (ok) showToast("Auto-saved changes");
      }
    }

    // add new timer (admin)
    document.getElementById("add-timer").onclick = async () => {
      const name = prompt("Enter Boss Name:");
      const hoursRaw = prompt("Enter Loop Duration (hours):");
      const hours = parseFloat(hoursRaw);
      if (!name || !Number.isFinite(hours) || hours <= 0) return alert("Invalid input.");
      const loopSecs = Math.round(hours * 3600);
      timers.push({ name, duration: loopSecs, remaining: loopSecs });
      renderTimers();
      if (!isApplyingRemote) {
        const payload = { timers: timers, lastUpdated: Date.now() };
        const ok = await pushBin(payload);
        if (ok) showToast("Auto-saved changes");
      }
    };

    // save button (also available) - still here as fallback
    document.getElementById("save-timers").onclick = async ()=>{
      const payload = { timers: timers, lastUpdated: Date.now() };
      const ok = await pushBin(payload);
      if (ok) showToast("Saved to JSONBin");
      else alert("Save failed (check API key).");
    };

    // auto-persist admin flag on unload
    window.addEventListener('beforeunload', ()=>{
      if (adminMode) localStorage.setItem("pookieAdmin","true");
      else localStorage.removeItem("pookieAdmin");
    });

    // expose helpers for debugging (optional)
    window._pookie = {
      getTimers: ()=>timers,
      pushNow: async ()=> await pushBin({ timers: timers, lastUpdated: Date.now() })
    };
  </script>
</body>
</html>
